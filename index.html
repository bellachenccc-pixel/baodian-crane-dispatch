<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="保电与吊车作业的生产计划、车辆调度、冲突校验和归场管理。"
    />
    <meta name="theme-color" content="#15211e" />
    <title>保电吊车调度台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M7 3v4M17 3v4M4 9h16"/><rect x="3" y="5" width="18" height="16" rx="3"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v11H3zM14 10h4l3 4v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5M12 18h.01"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 15v4h16v-4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 5 14h6l-1 8 9-13h-6V2Z"/></symbol>
      <symbol id="i-crane" viewBox="0 0 24 24"><path d="M4 21h16M8 21V5h9M8 8h10l3 3M13 5v16M18 8v7"/><path d="M16 15h4v3h-4z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-7 6-7s6 3 6 7M16 5a3 3 0 0 1 0 6M17 13c3 .5 4 3 4 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark"><svg><use href="#i-bolt"></use></svg></div>
          <div><strong>保电吊车</strong><span>调度台</span></div>
        </div>

        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item active" data-page="dashboard"><svg><use href="#i-grid"></use></svg><span>调度总览</span></button>
          <button class="nav-item" data-page="schedule"><svg><use href="#i-calendar"></use></svg><span>作业计划</span><b id="nav-task-count">0</b></button>
          <button class="nav-item" data-page="vehicles"><svg><use href="#i-truck"></use></svg><span>车辆台账</span></button>
          <button class="nav-item" data-page="bases"><svg><use href="#i-pin"></use></svg><span>归场点</span></button>
          <button class="nav-item" data-page="conflicts"><svg><use href="#i-alert"></use></svg><span>冲突中心</span><b class="warn" id="nav-conflict-count">0</b></button>
        </nav>

        <div class="sidebar-footer">
          <div class="data-state"><i></i><span>数据保存在本机浏览器</span></div>
          <div class="user-row"><div class="avatar">调</div><div><strong>车辆调度员</strong><span>管理员</span></div><button aria-label="更多"><svg><use href="#i-more"></use></svg></button></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="打开菜单"><span></span><span></span><span></span></button>
          <div class="page-heading"><p id="eyebrow">生产协同中心</p><h1 id="page-title">调度总览</h1></div>
          <div class="topbar-actions">
            <button class="week-switch" id="week-switch"><span id="week-label">第46—47周</span><small>2026年11月9日—22日</small><svg><use href="#i-arrow"></use></svg></button>
            <button class="btn btn-ghost" id="open-import"><svg><use href="#i-upload"></use></svg><span>导入生产计划</span></button>
            <button class="btn btn-primary" id="open-task"><svg><use href="#i-plus"></use></svg><span>新建任务</span></button>
          </div>
        </header>

        <div id="page-content" class="page-content" aria-live="polite"></div>
      </main>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" hidden></div>

    <section class="modal" id="task-modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title" hidden>
      <div class="modal-head"><div><p>新增调度记录</p><h2 id="task-modal-title">新建保电或吊车任务</h2></div><button class="icon-btn close-modal" aria-label="关闭"><svg><use href="#i-close"></use></svg></button></div>
      <form id="task-form" class="form-grid">
        <label class="span-2">任务类型<select name="type" required><option value="保电">保电</option><option value="吊车">吊车</option><option value="联合">保电 + 吊车</option></select></label>
        <label class="span-2">计划名称<input name="plan" required placeholder="例如：10kV设备检修保电工程" /></label>
        <label>日期<input name="date" type="date" required value="2026-11-17" /></label>
        <label>区域<select name="area"><option>通元</option><option>武原</option><option>沈荡</option><option>澉浦</option><option>百步</option></select></label>
        <label>开始时间<input name="start" type="time" required value="08:00" /></label>
        <label>结束时间<input name="end" type="time" required value="17:00" /></label>
        <label class="span-2">工作地点<input name="location" required placeholder="填写现场地址或变电站名称" /></label>
        <label>车辆需求<select name="demand"><option value="保电车">保电车</option><option value="8T吊车">8T吊车</option><option value="25T吊车">25T吊车</option><option value="保电车 + 25T吊车">保电车 + 25T吊车</option></select></label>
        <label>风险等级<select name="risk"><option>四级</option><option>三级</option><option>二级</option><option>无</option></select></label>
        <label>工作联络人<input name="contact" placeholder="姓名 / 电话" /></label>
        <label>执行部门<input name="department" placeholder="例如：项目一部三班" /></label>
        <label class="span-2">保电对象或作业说明<textarea name="detail" rows="3" placeholder="填写保电对象、吊装内容或现场说明"></textarea></label>
        <div class="form-actions span-2"><button type="button" class="btn btn-ghost close-modal">取消</button><button type="submit" class="btn btn-primary">创建并进入待调度</button></div>
      </form>
    </section>

    <section class="modal" id="import-modal" role="dialog" aria-modal="true" aria-labelledby="import-title" hidden>
      <div class="modal-head"><div><p>生产计划解析</p><h2 id="import-title">只保留保电和吊车作业</h2></div><button class="icon-btn close-modal" aria-label="关闭"><svg><use href="#i-close"></use></svg></button></div>
      <div class="import-rule"><div class="rule-icon"><svg><use href="#i-bolt"></use></svg></div><div><strong>当前筛选规则</strong><span>保电对象或工作内容包含“保电”，或车辆需求包含“吊车”。其他生产计划不会进入调度台。</span></div></div>
      <div class="import-list" id="import-list"></div>
      <div class="form-actions"><button type="button" class="btn btn-ghost close-modal">关闭</button><button type="button" class="btn btn-primary" id="refresh-samples">刷新内置样本</button></div>
    </section>

    <section class="modal assign-modal" id="assign-modal" role="dialog" aria-modal="true" aria-labelledby="assign-title" hidden>
      <div class="modal-head"><div><p>车辆调度</p><h2 id="assign-title">选择可用车辆</h2></div><button class="icon-btn close-modal" aria-label="关闭"><svg><use href="#i-close"></use></svg></button></div>
      <div id="assign-content"></div>
    </section>

    <div class="toast" id="toast" role="status" hidden><svg><use href="#i-check"></use></svg><span></span></div>

    <script src="./app.js"></script>
  </body>
</html>
